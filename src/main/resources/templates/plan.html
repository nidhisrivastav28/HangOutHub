<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/input.css}">
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script src="/js/script.js"></script>
    <title>Make a Plan</title>
</head>

<body>
   <!-- NAVBAR STARTS -->
     <div th:insert="~{fragments/navbar-after-login :: navbar-after-login}"></div>
    <!-- NAVBAR ENDS -->

    <!-- MAIN STARTS -->
    <div >
        <div class="flex flex-col md:flex-row h-auto md:h-screen justify-center items-center gap-8 px-8">
            <!-- LEFT: Image -->
            <div class="w-full md:w-1/2 flex justify-center">
                <div class="swiper mySwiper w-96 h-96 rounded-lg shadow-lg">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="/images/adventure.jpg" class="w-full h-full object-cover rounded-lg shadow-lg"
                        alt="Adventure">
                        </div>
                        <div class="swiper-slide">
                            <img src="/images/couple.jpg" class="w-full h-full object-cover rounded-lg shadow-lg"
                        alt="Couple">
                        </div>
                        <div class="swiper-slide">
                            <img src="/images/foodie.jpg" class="w-full h-full object-cover rounded-lg shadow-lg"
                        alt="Foodie">
                        </div>
                        <div class="swiper-slide">
                            <img src="/images/games.jpg" class="w-full h-full object-cover rounded-lg shadow-lg"
                        alt="Games">
                        </div>
                        <div class="swiper-slide">
                            <img src="/images/shopping.jpg" class="w-full h-full object-cover rounded-lg shadow-lg"
                        alt="Shopping">
                        </div>
                        <div class="swiper-slide">
                            <img src="/images/party.jpg" class="w-full h-full object-cover rounded-lg shadow-lg"
                        alt="Party">
                        </div>
                    </div>

                    <div class="swiper-pagination"></div>

                </div>
                
            
            </div>

            <!-- RIGHT: Form -->
            <div class="w-full md:w-1/2 bg-white rounded-lg shadow-lg p-8 
            transition-all duration-700 
            hover:-translate-y-2 
            hover:shadow-[0_8px_30px_rgba(0,0,0,0.2)] 
            hover:border-4 hover:border-transparent 
            hover:bg-gradient-to-r hover:from-pink-100 hover:to-purple-100">
                <form th:action="@{/plans}" method="post" class="px-6 py-4 rounded-lg space-y-6">
                    <h2 class="text-2xl font-bold">Plan your next HangOut</h2>
                    <p class="text-gray-600">Set your Vibe and Preferences below</p>

                    <!-- Mood -->
                    <fieldset>
                        <legend class="font-semibold">Mood:</legend>
                        <div class="flex flex-wrap gap-3 mt-2">
                            <th:block th:each="m : ${moods}"> 
                                <label>
                                    <input type="radio" name="mood" th:value="${m.id}"> 
                                    <span th:text="${m.name}"></span>
                                </label>
                            </th:block>
                        </div>
                    </fieldset>

                    <!-- Location -->
                    <div>
                        <label for="locationDropdown" class="font-semibold" >Location:</label>
                        <div class="flex gap-3 mt-2">
                            <select id="locationDropdown" name="location" class="border p-2 rounded w-full">
                                <option value="">Select Area</option>
                                <th:block th:each="loc : ${locations}">
                                    <option th:value="${loc.id}" th:text="${loc.locationName}"></option>
                                </th:block>
                            </select>
                            <p class="mt-4">OR</p>
                            <button type="button" id="useLocationBtn" onclick="getLocation()" class="bg-blue-500 text-white px-4 py-2 rounded">
                                Use My Location
                            </button>
                        </div>
                    </div>

                    <!-- Budget -->
                    <div>
                        <label for="budgetDropdown" class="font-semibold">Budget:</label>
                        <select id="budgetDropdown" name="budget" class="border p-2 rounded w-full mt-2">
                            <option value="">Select Budget</option>
                            <th:block th:each="b : ${budgets}">
                                <option th:value="$b.id" th:text="${b.range}"></option>
                            </th:block>
                        </select>
                    </div>

                    <!-- Submit -->
                    <button type="submit" onclick="showPlaces()" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700">
                        🔍 Show Suitable Places
                    </button>
                </form>
                <div>
                    <p id="output"></p>
                </div>
            </div>
        </div>
    </div>
    <div>
        <table>
    <tr>
        <th>Name</th>
        <th>Address</th>
        <th>Description</th>
        <th>Image</th>
    </tr>
    <tr th:each="place : ${places}">
        <td th:text="${place.placeName}"></td>
        <td th:text="${place.address}"></td>
        <td th:text="${place.description}"></td>
        <td><img th:src="@{${place.images}}" alt="place image" width="100"/></td>
    </tr>
</table>

    </div>
    <!-- MAIN ENDS -->

    <!-- FOOTER STARTS -->
    <div th:insert="~{fragments/footer :: footer}"></div>
    <!-- FOOTER ENDS -->

    

</body>

</html>
