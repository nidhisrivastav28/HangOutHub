<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/input.css}">
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <link rel="icon" type="image/png" href="/images/logo_darkbg.png" alt="">
    <title>Feedback</title>
    <style>
        .star {
            transition: color 0.2s;
        }

        /* Selected stars (left fill) */
        input[type="radio"]:checked~label {
            color: #fcd34d;
        }

        /* Hover stars (left fill) */
        .star:hover,
        .star:hover~label {
            color: #fcd34d;
        }
    </style>
</head>

<body>
    <div class="min-h-screen forcenter bg-gray-50">
        <div class="w-full max-w-lg bg-white p-10 rounded-2xl shadow-lg space-y-8">
            <!-- Logo -->
            <div class="forcenter">
                <img src="images/logo_lightbg.png" class="h-20" alt="Logo">
            </div>
            <!-- Heading -->
            <h1 class="font-bold forcenter text-4xl">We value your opinions</h1>
            <!-- Form -->
            <form class="space-y-6" th:action="@{/feedback}" method="post">
                <!-- Question -->
                <p class="text-gray-700 font-medium">How would you rate your overall experience?</p>

                <!--  Star Rating (radio button based) -->
                <div class="flex justify-center space-x-1 flex-row-reverse">
                    <input type="radio" name="rating" id="star5" value="5" class="hidden">
                    <label for="star5" class="star cursor-pointer text-4xl text-gray-300">★</label>

                    <input type="radio" name="rating" id="star4" value="4" class="hidden">
                    <label for="star4" class="star cursor-pointer text-4xl text-gray-300">★</label>

                    <input type="radio" name="rating" id="star3" value="3" class="hidden">
                    <label for="star3" class="star cursor-pointer text-4xl text-gray-300">★</label>

                    <input type="radio" name="rating" id="star2" value="2" class="hidden">
                    <label for="star2" class="star cursor-pointer text-4xl text-gray-300">★</label>

                    <input type="radio" name="rating" id="star1" value="1" class="hidden">
                    <label for="star1" class="star cursor-pointer text-4xl text-gray-300">★</label>
                </div>

                <input type="hidden" name="rating" id="ratingInput" value="0">

                <!-- Text -->
                <p class="text-gray-700 font-medium">Kindly take a moment to tell us what you think.</p>
                <!-- Name -->
                <input type="text" name="name" id=""
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none"
                    placeholder="Please enter your name">
                <!-- Email -->
                <input type="email" name="email" id=""
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none"
                    placeholder="Please enter your email">
                <!-- Message -->
                <textarea name="msg" id="" placeholder="Any Message for Us?"
                    class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-yellow-400 outline-none h-24"></textarea>
                <!-- Submit -->
                <button type="submit"
                    class="w-full bg-yellow-400 hover:bg-yellow-500 text-white font-semibold py-3 rounded-lg shadow-md transition">Share
                    my feedback</button>
            </form>
        </div>

        <!-- Thank you pop up -->
        <div id="thankyouPopup" class=" fixed inset-0 items-center justify-center bg-black bg-opacity-50 hidden">
            <div class="bg-white p-8 rounded shadow-lg text-center space-y-4">
                <h2 class="text-2xl font-bold text-green-600">Thank You!!</h2>
                <p>Your feedback has been submitted successfully</p>
            </div>
        </div>
    </div>


    <!-- Feedback submission pop-up -->
    <script th:if="${feedbackSuccess}">
        alert("Thank you for your feedback!");
        window.location.href = "/home-login";  
    </script>
    <script th:src="@{/js/script.js}"></script>
</body>

</html>
