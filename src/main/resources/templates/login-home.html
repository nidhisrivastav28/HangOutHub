<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/input.css}">
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <script src="/js/script.js"></script>

    <link rel="icon" type="image/png" href="/images/logo_darkbg.png" alt="">
    <title>HangOutHub</title>
</head>

<body>
    <!-- NAVBAR STARTS -->
     <div th:if="${session.username != null}" th:insert="fragments/navbar-after-login :: navbar-after-login"></div>
    <!-- NAVBAR ENDS -->

    <!-- MAIN STARTS -->
    <div class="min-h-screen bg-gray-200 p-6 flex flex-col items-center justify-center text-center">
        <h1 class="text-4xl font-bold text-purple-700 mb-2">Hey <span th:text="${username}"></span>!!</h1>
        <p class="text-2xl text-gray-800 mb-2">Ready for the next plan??</p>
        <p class="text-lg text-gray-600 mb-6">Pick a vibe...</p>

        <!-- Mood Buttons -->
        <div class="flex flex-wrap justify-center gap-4 mb-8">
            <button class="mood-btn bg-pink-500 hover:bg-pink-600 text-white py-2 px-4 rounded-full"
                data-mood="chill">Chill 😌</button>
            <button class="mood-btn bg-yellow-400 hover:bg-yellow-500 text-white py-2 px-4 rounded-full"
                data-mood="party">Party 🎉</button>
            <button class="mood-btn bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-full"
                data-mood="nature">Nature 🌿</button>
            <button class="mood-btn bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-full"
                data-mood="solo">Solo 🧘‍♀️</button>
            <button class="mood-btn bg-purple-500 hover:bg-purple-600 text-white py-2 px-4 rounded-full"
                data-mood="group">Group 👯‍♀️</button>
        </div>

        <!-- Next Section (hidden initially) -->

    </div>
    <!-- MAIN ENDS -->

    
     <!-- FOOTER STARTS -->
    <div th:insert="fragments/footer :: footer"></div>
    <!-- FOOTER ENDS -->
    
</body>

</html>
