<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/input.css}">
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <script src="/js/script.js"></script>
    <title>HangOutHub</title>
</head>

<body>
    <!-- NAVBAR STARTS -->
    <nav class="bg-gradient-to-r from-purple-600 to-pink-500 text-white p-4">
        <div class="flex justify-between items-center max-w-6xl mx-auto">
            <div class="flex items-center">
                <img src="images/logo_darkbg.png" class="w-14 h-14 -m-3" alt="">
                <h1 class="text-2xl font-bold">angOutHub</h1>
            </div>
            <div>
                <ul class="flex space-x-6">
                    <li><a href="#" class="hover:text-gray-200 space">Home</a></li>
                    <li><a href="#" class="hover:text-gray-200 space-x-6">About Us</a></li>
                    <li><a href="/feedback" class="hover:text-gray-200 space-x-6">Feedback</a></li>
                    <li><a href="#" class="hover:text-gray-200 space-x-6">Nidhi</a></li>
                    <li class="relative">
                        <button onclick="toggleDropdown()"
                            class="flex items-center gap-1 hover:underline focus:outline-none">
                            Profile
                        </button>

                        <ul id="dropdownMenu"
                            class="absolute right-0 mt-2 w-40 bg-white text-black rounded shadow-lg hidden z-50">
                            <li><a href="#" class="block px-4 py-2 hover:bg-gray-100">Dashboard</a></li>
                            <li><a href="#" class="block px-4 py-2 hover:bg-gray-100">Settings</a></li>
                            <li><a href="#" class="block px-4 py-2 hover:bg-gray-100">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- NAVBAR ENDS -->

    <!-- MAIN STARTS -->
    <div class="min-h-screen bg-gray-200 p-6 flex flex-col items-center justify-center text-center">
        <h1 class="text-4xl font-bold text-purple-700 mb-2">Hey <span th:text="${username}"></span>!!</h1>
        <p class="text-2xl text-gray-800 mb-2">Ready for the next plan??</p>
        <p class="text-lg text-gray-600 mb-6">Pick a vibe...</p>

        <!-- Mood Buttons -->
        <div class="flex flex-wrap justify-center gap-4 mb-8">
            <button class="mood-btn bg-pink-500 hover:bg-pink-600 text-white py-2 px-4 rounded-full"
                data-mood="chill">Chill 😌</button>
            <button class="mood-btn bg-yellow-400 hover:bg-yellow-500 text-white py-2 px-4 rounded-full"
                data-mood="party">Party 🎉</button>
            <button class="mood-btn bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-full"
                data-mood="nature">Nature 🌿</button>
            <button class="mood-btn bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-full"
                data-mood="solo">Solo 🧘‍♀️</button>
            <button class="mood-btn bg-purple-500 hover:bg-purple-600 text-white py-2 px-4 rounded-full"
                data-mood="group">Group 👯‍♀️</button>
        </div>

        <!-- Next Section (hidden initially) -->

    </div>
    <!-- MAIN ENDS -->

    <!-- FOOTER STARTS -->
    <footer class="bg-[#1e1e1e] text-gray-200 py-6">

        <!-- Logo and Brand -->
        <div class="flex justify-center items-center">
            <img src="images/logo_darkbg.png" class="w-10 h-10 -mx-3" alt="Logo">
            <span class="text-lg font-semibold">angOutHub</span>
        </div>
        <div class="flex justify-center items-center space-x-4">
            <a href="#" class="hover:underline hover:text-white">About</a>
            <a href="#" class="hover:underline hover:text-white">Feedback</a>
            <a href="#" class="hover:underline hover:text-white">Privacy Policy</a>
        </div>
        <div class="flex justify-center items-center gap-1">
            <span class="italic">Design & Developed by </span>
            <br><span>Nidhi Srivastav | 2025 </span>
        </div>
    </footer>
    <!-- FOOTER ENDS -->
    
</body>

</html>
