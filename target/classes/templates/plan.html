                            class="flex items-center gap-1 hover:underline focus:outline-none">
                            Profile
                        </button>

                        <ul id="dropdownMenu"
                            class="absolute right-0 mt-2 w-40 bg-white text-black rounded shadow-lg hidden z-50">
                            <li><a href="#" class="block px-4 py-2 hover:bg-gray-100">Dashboard</a></li>
                            <li><a href="#" class="block px-4 py-2 hover:bg-gray-100">Settings</a></li>

                        </ul>
                    </li>
                </ul>
            </div>
        </div>

    <!-- MAIN STARTS -->
    <div>
        <div>
            <div>
                <p>Plan your next HangOut</p>
                <p>Set your Vibe and Preferences below</p>
                <form action="">
                    <p>Start a New HangOut Plan</p>
                    <div>
                        <label for="Mood">Mood: </label>
                        <input type="radio" name="mood" value="chill">Chill
                        <input type="radio" name="mood" value="party">Party
                        <input type="radio" name="mood" value="nature">Nature
                        <input type="radio" name="mood" value="adventure">Adventure
                        <input type="radio" name="mood" value="romantic">Romantic
                        <input type="radio" name="mood" value="cultural">Cultural
                        <input type="radio" name="mood" value="foodie">Foodie
                        <input type="radio" name="mood" value="shopping">Shopping
                    </div>

                    <div class="flex">
                        <label for="Location">Location:</label>
                        <div>
                            <!-- Dropdown -->
                            <select id="areaDropdown" name="location">
                                <option value="">Select Area</option>
                                <option value="park_street">Park Street</option>
                                <option value="salt_lake">Salt Lake</option>
                                <option value="new_town">New Town</option>
                                <option value="howrah">Howrah</option>
                            </select>

                            <!-- Use My Location -->
                            <button type="button" id="useLocationBtn">
                                Use My Location
                            </button>
                        </div>
                    </div>

                    <div>
                        <label for="Budget">Budget:</label>
                        <select id="areaDropdown" name="budget">
                            <option value="">Select Budget</option>
                            <option value="Under Rs.200">Under Rs.200</option>
                            <option value="Rs 200-Rs 500">Rs 200-Rs 500</option>
                            <option value="Rs 500 - Rs 1000">Rs 500 - Rs 1000</option>
                            <option value="Above Rs 1000">Above Rs 1000</option>
                        </select>
                    </div>

                    <!-- FEATURES TO ADD LATER ON -->

                    <div>

                    <button type="submit">🔍 Show Suitable Places</button>
