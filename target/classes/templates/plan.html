<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/input.css}">
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script src="/js/script.js"></script>
    <title>Make a Plan</title>
</head>

<body>
    <!-- NAVBAR STARTS -->
    <nav class="bg-gradient-to-r from-purple-600 to-pink-500 text-white p-4">
        <div class="flex justify-between items-center max-w-6xl mx-auto">
            <div class="flex items-center">
                <img src="images/logo_darkbg.png" class="w-14 h-14 -m-3" alt="">
                <h1 class="text-2xl font-bold">angOutHub</h1>
            </div>
            <div>
                <ul class="flex space-x-6">
                    <li><a href="/home-login" class="hover:text-gray-200 space">Home</a></li>
                    <li><a href="/plan" class="hover:text-gray-200 space-x-6">Make a Plan</a></li>
                    <li><a href="/feedback" class="hover:text-gray-200 space-x-6">Feedback</a></li>
                    <li><a href="#" class="hover:text-gray-200 space-x-6">Nidhi</a></li>
                    <li class="relative">
                        <button onclick="toggleDropdown()"
                            class="flex items-center gap-1 hover:underline focus:outline-none">
                            Profile
                        </button>

                        <ul id="dropdownMenu"
                            class="absolute right-0 mt-2 w-40 bg-white text-black rounded shadow-lg hidden z-50">
                            <li><a href="#" class="block px-4 py-2 hover:bg-gray-100">Dashboard</a></li>
                            <li><a href="#" class="block px-4 py-2 hover:bg-gray-100">Settings</a></li>
                            <li><a href="#" class="block px-4 py-2 hover:bg-gray-100">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- NAVBAR ENDS -->

    <!-- MAIN STARTS -->
    <div >
        <div class="flex flex-col md:flex-row h-auto md:h-screen justify-center items-center gap-8 px-8">

            <!-- LEFT: Image -->
            <div class="w-full md:w-1/2 flex justify-center">
                <div class="swiper mySwiper w-96 h-96 rounded-lg shadow-lg">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="/images/adventure.jpg" class="w-full h-full object-cover rounded-lg shadow-lg"
                        alt="Adventure">
                        </div>
                        <div class="swiper-slide">
                            <img src="/images/couple.jpg" class="w-full h-full object-cover rounded-lg shadow-lg"
                        alt="Couple">
                        </div>
                        <div class="swiper-slide">
                            <img src="/images/foodie.jpg" class="w-full h-full object-cover rounded-lg shadow-lg"
                        alt="Foodie">
                        </div>
                        <div class="swiper-slide">
                            <img src="/images/games.jpg" class="w-full h-full object-cover rounded-lg shadow-lg"
                        alt="Games">
                        </div>
                        <div class="swiper-slide">
                            <img src="/images/shopping.jpg" class="w-full h-full object-cover rounded-lg shadow-lg"
                        alt="Shopping">
                        </div>
                        <div class="swiper-slide">
                            <img src="/images/party.jpg" class="w-full h-full object-cover rounded-lg shadow-lg"
                        alt="Party">
                        </div>
                    </div>

                    <div class="swiper-pagination"></div>

                </div>
                
            
            </div>

            <!-- RIGHT: Form -->
            <div class="w-full md:w-1/2 bg-white rounded-lg shadow-lg p-8 
            transition-all duration-700 
            hover:-translate-y-2 
            hover:shadow-[0_8px_30px_rgba(0,0,0,0.2)] 
            hover:border-4 hover:border-transparent 
            hover:bg-gradient-to-r hover:from-pink-100 hover:to-purple-100">
                <form action="" class="px-6 py-4 rounded-lg space-y-6">
                    <h2 class="text-2xl font-bold">Plan your next HangOut</h2>
                    <p class="text-gray-600">Set your Vibe and Preferences below</p>

                    <!-- Mood -->
                    <fieldset>
                        <legend class="font-semibold">Mood:</legend>
                        <div class="flex flex-wrap gap-3 mt-2">
                            <label><input type="radio" name="mood" value="chill" class="bg-light-blue"> Chill</label>
                            <label><input type="radio" name="mood" value="party"> Party</label>
                            <label><input type="radio" name="mood" value="nature"> Nature</label>
                            <label><input type="radio" name="mood" value="adventure"> Adventure</label>
                            <label><input type="radio" name="mood" value="romantic"> Romantic</label>
                            <label><input type="radio" name="mood" value="cultural"> Cultural</label>
                            <label><input type="radio" name="mood" value="foodie"> Foodie</label>
                            <label><input type="radio" name="mood" value="shopping"> Shopping</label>
                        </div>
                    </fieldset>

                    <!-- Location -->
                    <div>
                        <label for="locationDropdown" class="font-semibold">Location:</label>
                        <div class="flex gap-3 mt-2">
                            <select id="locationDropdown" name="location" class="border p-2 rounded w-full">
                                <option value="">Select Area</option>
                                <option value="park_street">Park Street</option>
                                <option value="salt_lake">Salt Lake</option>
                                <option value="new_town">New Town</option>
                                <option value="howrah">Howrah</option>
                            </select>
                            <p class="mt-4">OR</p>
                            <button type="button" id="useLocationBtn" class="bg-blue-500 text-white px-4 py-2 rounded">
                                Use My Location
                            </button>
                        </div>
                    </div>

                    <!-- Budget -->
                    <div>
                        <label for="budgetDropdown" class="font-semibold">Budget:</label>
                        <select id="budgetDropdown" name="budget" class="border p-2 rounded w-full mt-2">
                            <option value="">Select Budget</option>
                            <option value="Under Rs.200">Under Rs.200</option>
                            <option value="Rs 200-Rs 500">Rs 200-Rs 500</option>
                            <option value="Rs 500 - Rs 1000">Rs 500 - Rs 1000</option>
                            <option value="Above Rs 1000">Above Rs 1000</option>
                        </select>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700">
                        🔍 Show Suitable Places
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- MAIN ENDS -->

    <script>
    var swiper = new Swiper(".mySwiper", {
  loop: true,
  autoplay: {
    delay: 1500,
    disableOnInteraction: false,
  },
  pagination: {
    el: ".swiper-pagination",
    clickable: true,
  }
});
</script>

</body>

</html>
